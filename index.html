<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz HTA - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        h1 { color: #1e3c72; }
        input { padding: 10px; width: 100%; font-size: 16px; }
        button { background: #1e3c72; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        button:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Quiz HTA - Page Test</h1>
        <p>Si vous voyez ce texte, c'est bon !</p>
        <input type="text" placeholder="Entrez votre nom" id="nameInput">
        <button onclick="alert('Hello ' + document.getElementById('nameInput').value)">Tester le bouton</button>
    </div>
</body>
</html>
